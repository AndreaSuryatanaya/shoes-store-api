services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-shoes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di file .env}
      POSTGRES_DB: ${DB_NAME:-shoes_store_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shoes} -d ${DB_NAME:-shoes_store_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-shoes}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-shoes_store_db}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di file .env}
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
